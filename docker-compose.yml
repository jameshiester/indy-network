version: '3.8'
services:
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    image: indy-server:latest
    ports:
      - 8080:8080
    environment:
      - GENESIS_TXN_PATH=/app/genesis.txn
      - GENESIS_S3_BUCKET=indy-genesis-dv
      - GENESIS_S3_KEY=pool_transactions
      - AWS_REGION=us-east-1
      - AWS_PROFILE=default
      - AWS_SDK_LOAD_CONFIG=1
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=postgres
      - DB_SCHEMA=public
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
  postgres:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres