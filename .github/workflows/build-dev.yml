name: 'Deploy Dev'
run-name: ${{ github.actor}} is running a Terraform review and deploy to Dev 🚀
on:
  push:
    branches:
      - dev
permissions:
  id-token: write
  contents: read
env:
  TF_LOG: INFO
  AWS_REGION: ${{ vars.TF_VAR_REGION }}
  AWS_BUCKET_NAME: ${{ secrets.TF_STATE_BUCKET_NAME }}
  AWS_BUCKET_KEY_NAME: ${{ secrets.TF_STATE_BUCKET_KEY }}
  IMAGE_TAG: ${{ github.sha }}
  TF_VAR_AZ01: ${{ vars.TF_VAR_AZ01 }}
  TF_VAR_AZ02: ${{ vars.TF_VAR_AZ02 }}
  TF_VAR_ECR_MONITOR_REPO_URL: ${{ vars.TF_VAR_ECR_MONITOR_REPO_URL }}
  TF_VAR_ECR_MONITOR_REPO: ${{ vars.TF_VAR_ECR_MONITOR_REPO }}
  TF_VAR_ECR_NODE_REPO_URL: ${{ vars.TF_VAR_ECR_NODE_REPO_URL }}
  TF_VAR_ECR_NODE_REPO: ${{ vars.TF_VAR_ECR_NODE_REPO }}
  TF_VAR_ECR_UTILS_REPO_URL: ${{ vars.TF_VAR_ECR_UTILS_REPO_URL }}
  TF_VAR_ECR_UTILS_REPO: ${{ vars.TF_VAR_ECR_UTILS_REPO }}
  TF_VAR_ECR_SERVER_REPO_URL: ${{ vars.TF_VAR_ECR_SERVER_REPO_URL }}
  TF_VAR_ECR_SERVER_REPO: ${{ vars.TF_VAR_ECR_SERVER_REPO }}
  TF_VAR_ECSCluster: ${{ vars.TF_VAR_ECSCLUSTER }}
  TF_VAR_ECSService: ${{ vars.TF_VAR_ECSSERVICE }}
  TF_VAR_EnvCode: ${{ vars.TF_VAR_ENVCODE }}
  TF_VAR_EnvTag: ${{ vars.TF_VAR_ENVTAG }}
  TF_VAR_GitHubRepo: ${{ vars.TF_VAR_GITHUBREPO }}
  TF_VAR_NETWORK_NAME: ${{ vars.TF_VAR_NETWORK_NAME }}
  TF_VAR_Prefix: ${{ vars.TF_VAR_PREFIX }}
  TF_VAR_Region: ${{ vars.TF_VAR_REGION }}
  TF_VAR_SOLTAG: ${{ vars.TF_VAR_SOLTAG }}
  TF_VAR_VPCCIDR: ${{ vars.TF_VAR_VPCCIDR }}
  TF_VAR_SERVER_CONTAINER_NAME: ${{ vars.TF_VAR_SERVER_CONTAINER_NAME }}
  TF_VAR_MONITOR_CONTAINER_NAME: ${{ vars.TF_VAR_MONITOR_CONTAINER_NAME }}
  TF_VAR_DOMAIN: ${{ vars.TF_VAR_DOMAIN }}

jobs:
  docker-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docker/node
    environment:
      name: dev

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_VAR_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHub-Actions-OIDC-TERRAFORM

      - name: Check ECS image exists
        id: ecsimage
        run: |
          if aws ecr describe-images --repository-name ${{ vars.TF_VAR_ECR_NODE_REPO_URL }} --image-ids imageTag=$IMAGE_TAG >/dev/null 2>&1
          then
            echo "image_exists=true" >> "$GITHUB_ENV"
          else
            echo "image_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Check for changes in go api
        uses: dorny/paths-filter@v3
        id: filter
        with:
          working-directory: ./docker/node
          base: ${{ github.ref }}
          filters: |
            docker:
              - './**'

      - name: Login to Amazon ECR
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        id: build-image
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.TF_VAR_ECR_NODE_REPO_URL }}
        run: |
          docker build -t $REPOSITORY:$IMAGE_TAG -f ./Dockerfile .
          docker push $REPOSITORY:$IMAGE_TAG
          docker tag $REPOSITORY:$IMAGE_TAG $REPOSITORY:latest
          docker push $REPOSITORY:latest
          echo "image=$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  docker-utils:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docker/genesis
    environment:
      name: dev

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_VAR_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHub-Actions-OIDC-TERRAFORM

      - name: Check ECS image exists
        id: ecsimage
        run: |
          if aws ecr describe-images --repository-name ${{ vars.TF_VAR_ECR_UTILS_REPO_URL }} --image-ids imageTag=$IMAGE_TAG >/dev/null 2>&1
          then
            echo "image_exists=true" >> "$GITHUB_ENV"
          else
            echo "image_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Check for changes in go api
        uses: dorny/paths-filter@v3
        id: filter
        with:
          working-directory: ./docker/genesis
          base: ${{ github.ref }}
          filters: |
            docker:
              - './**'

      - name: Login to Amazon ECR
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        id: build-image
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.TF_VAR_ECR_UTILS_REPO_URL }}
        run: |
          docker build -t $REPOSITORY:$IMAGE_TAG -f ./Dockerfile .
          docker push $REPOSITORY:$IMAGE_TAG
          docker tag $REPOSITORY:$IMAGE_TAG $REPOSITORY:latest
          docker push $REPOSITORY:latest
          echo "image=$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  terraform:
    runs-on: ubuntu-latest
    needs: [docker-node, docker-utils]
    defaults:
      run:
        working-directory: ./terraform/infrastructure
    environment:
      name: dev
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_VAR_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHub-Actions-OIDC-TERRAFORM

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker Image
        run: |
          docker pull ${{ vars.TF_VAR_ECR_UTILS_REPO_URL }}:$IMAGE_TAG

      - name: Create Indy Config
        run: |
          sudo mkdir -p /etc/indy
          sudo tee /etc/indy/indy_config.py > /dev/null <<EOF
          NETWORK_NAME='${{ vars.TF_VAR_NETWORK_NAME }}'
          KEYS_DIR='/var/lib/indy'
          EOF

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -no-color
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_NAME }}" -backend-config="key=${{ secrets.TF_STATE_BUCKET_KEY }}" -backend-config="region=${{ vars.TF_VAR_REGION }}" -backend-config="encrypt=true" -backend-config="dynamodb_table=${{ secrets.TF_STATE_DYNAMODB_TABLE }}" -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        id: base
        run: terraform apply -auto-approve -input=false

  ecr-monitor:
    runs-on: ubuntu-latest
    needs: terraform
    environment:
      name: dev
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      image_exists: ${{ steps.ecsimage.outputs.image_exists }}
      changes: ${{ steps.filter.outputs.docker }}
    env:
      REPOSITORY: ${{ vars.TF_VAR_ECR_MONITOR_REPO_URL }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_VAR_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHub-Actions-OIDC-TERRAFORM

      - name: Check ECS image exists
        id: ecsimage
        env:
          REPOSITORY: ${{ vars.TF_VAR_ECR_MONITOR_REPO_URL }}
        run: |
          if aws ecr describe-images --repository-name $REPOSITORY --image-ids imageTag=$IMAGE_TAG >/dev/null 2>&1
          then
            echo "image_exists=true" >> "$GITHUB_ENV"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_exists=false" >> "$GITHUB_ENV"
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes in go api
        uses: dorny/paths-filter@v3
        id: filter
        with:
          working-directory: ./
          base: ${{ github.ref }}
          filters: |
            docker:
              - './**'

      - name: Login to Amazon ECR
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        id: build-image
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.TF_VAR_ECR_MONITOR_REPO_URL }}
        run: |
          docker build -t $REPOSITORY:$IMAGE_TAG -f ./docker/monitor/Dockerfile ./docker/monitor
          docker push $REPOSITORY:$IMAGE_TAG
          docker tag $REPOSITORY:$IMAGE_TAG $REPOSITORY:latest
          docker push $REPOSITORY:latest
          echo "image=$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  ecr-server:
    runs-on: ubuntu-latest
    needs: terraform
    environment:
      name: dev
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      changes: ${{ steps.filter.outputs.docker }}
    env:
      REPOSITORY: ${{ vars.TF_VAR_ECR_SERVER_REPO_URL }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_VAR_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHub-Actions-OIDC-TERRAFORM

      - name: Check ECS image exists
        id: ecsimage
        env:
          REPOSITORY: ${{ vars.TF_VAR_ECR_SERVER_REPO_URL }}
        run: |
          if aws ecr describe-images --repository-name $REPOSITORY --image-ids imageTag=$IMAGE_TAG >/dev/null 2>&1
          then
            echo "image_exists=true" >> "$GITHUB_ENV"
          else
            echo "image_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Check for changes in go api
        uses: dorny/paths-filter@v3
        id: filter
        with:
          working-directory: ./
          base: ${{ github.ref }}
          filters: |
            docker:
              - './**'

      - name: Login to Amazon ECR
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        id: build-image
        if: steps.filter.outputs.docker == 'true' || env.image_exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.TF_VAR_ECR_SERVER_REPO_URL }}
        run: |
          docker build -t $REPOSITORY:$IMAGE_TAG -f ./docker/server/Dockerfile .
          docker push $REPOSITORY:$IMAGE_TAG
          docker tag $REPOSITORY:$IMAGE_TAG $REPOSITORY:latest
          docker push $REPOSITORY:latest
          echo "image=$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  update-task-definition:
    runs-on: ubuntu-latest
    needs: [ecr-monitor, ecr-server]
    environment:
      name: dev
    env:
      REPOSITORY: ${{ vars.TF_VAR_ECR_SERVER_REPO_URL }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_VAR_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHub-Actions-OIDC-TERRAFORM

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download task definition
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TASK_DEFINITION: ${{ vars.TF_VAR_ECR_SERVER_REPO }}
        # if: ${{needs.ecr-monitor.outputs.changes}} || ${{needs.ecr-server.outputs.changes}}
        run: |
          aws ecs describe-task-definition --task-definition $TASK_DEFINITION --query taskDefinition > task-definition.json

      - name: Setup
        id: setup-task-definition
        run: |
          echo ${{needs.ecr-server.outputs.image}}
          echo ${{needs.ecr-monitor.outputs.image}}

      - name: Fill in the new image ID in the Amazon ECS task definition
        # if: ${{needs.ecr-server.outputs.changes}}
        id: task-def-server
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.TF_VAR_SERVER_CONTAINER_NAME }}
          image: ${{needs.ecr-server.outputs.image}}

      - name: Fill in the new image ID in the Amazon ECS task definition
        # if: ${{needs.ecr-monitor.outputs.changes}}
        id: task-def-monitor
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ needs.ecr-server.outputs.changes == 'true' && steps.task-def-server.outputs.task-definition || 'task-definition.json' }}
          container-name: ${{ vars.TF_VAR_MONITOR_CONTAINER_NAME }}
          image: ${{needs.ecr-monitor.outputs.image}}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        # if: ${{needs.ecr-monitor.outputs.changes}} || ${{needs.ecr-server.outputs.changes}}
        with:
          task-definition: ${{ needs.ecr-monitor.outputs.changes == 'true' && steps.task-def-monitor.outputs.task-definition || steps.task-def-server.outputs.task-definition }}
          service: ${{ vars.TF_VAR_ECSSERVICE  }}
          cluster: ${{ vars.TF_VAR_ECSCLUSTER  }}
          wait-for-service-stability: true
          wait-for-minutes: 10
